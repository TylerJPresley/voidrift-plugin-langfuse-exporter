name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    defaults:
      run:
        working-directory: repo
    name: build / lint / test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - name: Checkout @voidrift/core
        # remove once @voidrift/core is published
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TylerJPresley/voidrift-core
          path: voidrift-core
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build @voidrift/core
        # remove once @voidrift/core is published
        working-directory: voidrift-core
        run: |
          npm install
          npm run build
      - name: Link @voidrift/core
        # remove once @voidrift/core is published
        working-directory: repo
        run: npm install --no-save ../voidrift-core
      - run: npm install
        # switch to npm ci + cache once lockfiles are committed
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
